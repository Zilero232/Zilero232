<svg xmlns="http://www.w3.org/2000/svg" width="452" height="352" viewBox="0 0 452 352" xml:space="preserve" role="img" aria-labelledby="stack-title stack-desc">
  <title id="stack-title">~/stack</title>
  <desc id="stack-desc">web: React, Vue. server: NestJS. games: Godot</desc>
  <style>
    text { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 14px; fill: #545464; white-space: pre; font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0; }
    .muted { fill: #727169; }
    .key { fill: #7E9CD8; font-weight: 700; }
    .accent { fill: #FFA066; font-weight: 700; }
    .prompt { fill: #98BB6C; font-weight: 700; }
    .bold { font-weight: 700; }
    .logo { fill: url(#stack-logo); font-weight: 700; }
    .reveal { opacity: 0; animation: reveal 0.45s ease-out forwards; }
    .cursor { fill: #545464; animation: blink 1.1s steps(1) infinite; }
    @keyframes reveal { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: none; } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .reveal { animation: none; opacity: 1; } .cursor { animation: none; } }
  </style>
  <defs>
    <linearGradient id="stack-logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7E9CD8" />
      <stop offset="1" stop-color="#957FB8" />
    </linearGradient>
    <clipPath id="stack-window"><rect width="452" height="352" rx="12" /></clipPath>
  </defs>

  <g clip-path="url(#stack-window)">
    <rect width="452" height="352" fill="#F2ECBC" />
    <rect width="452" height="36" fill="#16161D" />
    <line x1="0" y1="36" x2="452" y2="36" stroke="#2A2A37" />
    <circle cx="22" cy="18" r="6" fill="#E46876" />
    <circle cx="42" cy="18" r="6" fill="#FFA066" />
    <circle cx="62" cy="18" r="6" fill="#98BB6C" />
    <text x="226" y="23" text-anchor="middle" class="muted" data-testid="title">~/stack</text>
  </g>
  <rect x="0.5" y="0.5" width="451" height="351" rx="12" fill="none" stroke="#2A2A37" />

  <text x="24" y="68" data-testid="prompt"><tspan class="prompt">❯</tspan> tree ~/stack</text>


  <text x="24" y="104" class="reveal bold">~/stack</text>
  <text x="24" y="122" class="reveal" style="animation-delay: 0.08s" data-testid="area"><tspan class="muted" data-testid="branch">|-- </tspan><tspan fill="#E46876" class="bold" data-testid="name">web</tspan><tspan x="133.2" data-testid="tools">React · Vue</tspan></text>
  <text x="24" y="140" class="reveal" style="animation-delay: 0.16s" data-testid="area"><tspan class="muted" data-testid="branch">|-- </tspan><tspan fill="#FFA066" class="bold" data-testid="name">server</tspan><tspan x="133.2" data-testid="tools">NestJS</tspan></text>
  <text x="24" y="158" class="reveal" style="animation-delay: 0.24s" data-testid="area"><tspan class="muted" data-testid="branch">`-- </tspan><tspan fill="#E6C384" class="bold" data-testid="name">games</tspan><tspan x="133.2" data-testid="tools">Godot</tspan></text>

  <text x="24" y="194" class="muted reveal" style="animation-delay: 0.32s" data-testid="summary">3 directories, 4 files</text>

  <text x="24" y="330"><tspan class="prompt">❯</tspan></text>
<rect x="42" y="318" width="9" height="16" class="cursor" />


</svg>
