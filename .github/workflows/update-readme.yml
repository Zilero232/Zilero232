name: Update README

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [profile.yml, templates/**, src/**, package.json, bun.lock, .github/workflows/update-readme.yml]

# Two runs at once would race on the commit; queue them instead of cancelling a push mid-way.
concurrency:
  group: update-readme
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup

      # Fails the job before anything is written, so the last good cards stay committed.
      - name: Fetch GitHub data
        run: bun run fetch
        env:
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN || github.token }}

      - name: Render README and cards
        run: bun run build

      - name: Commit
        run: |
          if [ -z "$(git status --porcelain -- README.md assets)" ]; then
            echo 'Nothing changed' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md assets
          git commit -m 'chore(readme): refresh cards'
          git show --stat --format= HEAD >> "$GITHUB_STEP_SUMMARY"
          git push

      - name: Summary
        run: |
          {
            echo '## Cards'
            for card in header activity stack; do
              echo "![${card}](https://raw.githubusercontent.com/${{ github.repository }}/$(git rev-parse HEAD)/assets/${card}-dark.svg)"
            done
          } >> "$GITHUB_STEP_SUMMARY"
