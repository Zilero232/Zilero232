name: Update README

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [profile.yml, templates/**, generate.ts, github.graphql, .github/workflows/grs.yml]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - name: Fetch GitHub data
        run: bun run fetch
        env:
          # A PAT also counts private contributions; the default token sees public data only
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN || github.token }}

      - name: Render README and header
        run: bun run build

      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake-light.svg
            assets/snake-dark.svg?palette=github-dark

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add README.md assets
          git commit -m "Update README" || exit 0
          git push
